name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # This is a Windows-only project built with the GNU toolchain. The pin lives
  # in rust-toolchain.toml; this only makes the target explicit.
  CARGO_BUILD_TARGET: x86_64-pc-windows-gnu

jobs:
  check:
    # Run natively on Windows, but use GNU rather than the runner's MSVC toolchain.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW linker
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile default
          rustup show

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-gnu-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gnu-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

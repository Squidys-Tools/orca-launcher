name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # This is a Windows-only project built with the GNU toolchain. The pin lives
  # in rust-toolchain.toml; this only makes the target explicit.
  CARGO_BUILD_TARGET: x86_64-pc-windows-gnu

jobs:
  check:
    # MSVC-hosted runners cannot cross-compile to the GNU target, so we use a
    # self-hosted Windows agent that already has the GNU toolchain installed.
    # If this workflow has never run successfully, that agent is not configured
    # yet and CI is effectively local-only.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Install GNU toolchain
        run: rustup show

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-gnu-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gnu-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

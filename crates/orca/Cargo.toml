[package]
name = "orca"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "orca"
path = "src/main.rs"

# Depends on both halves of the workspace, plus the UI toolchain.
#
# `gpui` and `gpui_platform` are the workspace pin, so there is exactly one
# place the rev lives. `async-channel` carries hotkey and tray events onto the
# UI thread as values, because both arrive on threads of their own and neither
# may touch GPUI state. `raw-window-handle` is the trait `gpui::Window`
# implements to yield its `HWND`, which is what makes the retained popup in
# `src/win.rs` possible. `windows` is the five calls that close the gap
# `orca-win` leaves; see the module docs there before adding a sixth.
#
# `Win32_Graphics_Dwm` is the only namespace added for the popup's appearance:
# `DwmSetWindowAttribute` is the sole reason it is here. The feature list is
# not free — each namespace is a link-time import the GNU linker resolves — so
# it names the one call and nothing wider.
#
# `image` is here for one type: `image::Frame`, which is what
# `gpui::RenderImage::new` takes. gpui does not re-export `image`, so there is no
# way to hand it a decoded screen capture without naming the crate. It is
# already in the graph through gpui and is already compiled, so this adds no
# build cost — it adds a direct dependency edge and nothing else.
[dependencies]
async-channel.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "0.25", default-features = false }
orca-core = { path = "../orca-core" }
orca-win = { path = "../orca-win" }
raw-window-handle = "0.6.2"
windows = { workspace = true, features = ["Win32_Graphics_Dwm"] }

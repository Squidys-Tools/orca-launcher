[package]
name = "orca-win"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Windows platform integration: global hotkey, single-instance, autostart,
# tray, foreground, installed-app enumeration.
#
# This crate must never depend on `gpui`. It may depend on `windows`/`windows-sys`
# and on `orca-core`, but the dependency direction is one-way: orca-core knows
# nothing about this crate.
#
# `windows` is taken from the workspace so this crate and `orca-probe` cannot
# drift onto two copies of it. The feature list is the exact set of Win32
# namespaces this crate calls; widening it is not free, because every added
# namespace is a link-time import the GNU linker has to resolve.
[dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
